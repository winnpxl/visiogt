<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Talent earnings panel with milestone payouts over six months">
  <defs><style>.t{font-family:'Google Sans','Outfit',system-ui,sans-serif}.m{font-weight:500}</style>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a4e1c"/><stop offset="1" stop-color="#003d3d"/></linearGradient>
  </defs>
  <rect width="640" height="400" rx="12" fill="#ffffff"/>

  <text class="t m" x="32" y="44" font-size="16" fill="#001f1f" letter-spacing="-0.3">Earnings</text>
  <rect x="118" y="28" width="96" height="22" rx="11" fill="#eff5ce"/>
  <text class="t m" x="166" y="43" font-size="10" fill="#001f1f" text-anchor="middle">LAST 6 MONTHS</text>
  <text class="t m" x="608" y="46" font-size="24" fill="#001f1f" text-anchor="end" letter-spacing="-0.7">$41,250</text>
  <line x1="32" y1="70" x2="608" y2="70" stroke="#001f1f" stroke-opacity="0.08"/>

  <!-- bar chart -->
  <g transform="translate(32 96)">
    <g stroke="#001f1f" stroke-opacity="0.06">
      <line x1="0" y1="0" x2="576" y2="0"/>
      <line x1="0" y1="48" x2="576" y2="48"/>
      <line x1="0" y1="96" x2="576" y2="96"/>
      <line x1="0" y1="144" x2="576" y2="144"/>
    </g>
    <g>
      <rect x="20" y="88" width="46" height="56" rx="8" fill="url(#g3)" opacity="0.45"/>
      <rect x="116" y="66" width="46" height="78" rx="8" fill="url(#g3)" opacity="0.55"/>
      <rect x="212" y="74" width="46" height="70" rx="8" fill="url(#g3)" opacity="0.65"/>
      <rect x="308" y="40" width="46" height="104" rx="8" fill="url(#g3)" opacity="0.8"/>
      <rect x="404" y="24" width="46" height="120" rx="8" fill="url(#g3)"/>
      <rect x="500" y="6" width="46" height="138" rx="8" fill="#cdface"/>
      <rect x="500" y="6" width="46" height="138" rx="8" fill="url(#g3)" opacity="0.15"/>
    </g>
    <g class="t" font-size="10" fill="#889494">
      <text x="43" y="162" text-anchor="middle">Mar</text>
      <text x="139" y="162" text-anchor="middle">Apr</text>
      <text x="235" y="162" text-anchor="middle">May</text>
      <text x="331" y="162" text-anchor="middle">Jun</text>
      <text x="427" y="162" text-anchor="middle">Jul</text>
      <text x="523" y="162" text-anchor="middle">Aug</text>
    </g>
  </g>

  <line x1="32" y1="284" x2="608" y2="284" stroke="#001f1f" stroke-opacity="0.08"/>

  <g>
    <text class="t m" x="32" y="312" font-size="10" fill="#889494" letter-spacing="1">NEXT PAYOUT</text>
    <rect x="32" y="322" width="576" height="50" rx="12" fill="#f8fbe7"/>
    <circle cx="58" cy="347" r="9" fill="#001f1f"/>
    <path d="M54 347 L56.6 349.6 L62 344" stroke="#cdface" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t m" x="80" y="351" font-size="12.5" fill="#001f1f">Milestone 3 verified · releasing</text>
    <text class="t m" x="592" y="351" font-size="15" fill="#001f1f" text-anchor="end">$4,800</text>
  </g>
