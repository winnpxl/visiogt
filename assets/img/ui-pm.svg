<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Project manager update thread with weekly status and next milestone">
  <defs><style>.t{font-family:'DM Sans','Inter',system-ui,sans-serif}.m{font-weight:500}</style></defs>
  <rect width="640" height="400" rx="12" fill="#ffffff"/>

  <g>
    <circle cx="54" cy="46" r="22" fill="#003d3d"/>
    <text class="t m" x="54" y="52" font-size="15" fill="#cdface" text-anchor="middle">AO</text>
    <circle cx="70" cy="62" r="6" fill="#cdface" stroke="#ffffff" stroke-width="2"/>
    <text class="t m" x="88" y="42" font-size="14.5" fill="#001f1f">Adaeze O.</text>
    <text class="t" x="88" y="60" font-size="11.5" fill="#5c7070">Your Visio Project Manager · online</text>
  </g>
  <line x1="32" y1="88" x2="608" y2="88" stroke="#001f1f" stroke-opacity="0.08"/>

  <text class="t m" x="32" y="112" font-size="10" fill="#889494" letter-spacing="1">WEEK 6 UPDATE</text>

  <!-- message bubble -->
  <rect x="32" y="124" width="452" height="96" rx="14" fill="#e4f7f9"/>
  <text class="t" x="52" y="150" font-size="12.5" fill="#001f1f">Design system sign-off landed a day early. I've moved</text>
  <text class="t" x="52" y="170" font-size="12.5" fill="#001f1f">Kwame onto the payments integration and booked QA for</text>
  <text class="t" x="52" y="190" font-size="12.5" fill="#001f1f">the 19th. No action needed from your side.</text>
  <text class="t" x="52" y="209" font-size="10.5" fill="#5c7070">Today · 09:14</text>

  <!-- status chips -->
  <g transform="translate(32 240)">
    <rect width="176" height="60" rx="12" fill="#f8fbe7"/>
    <text class="t" x="18" y="26" font-size="10.5" fill="#5c7070">Milestones on time</text>
    <text class="t m" x="18" y="48" font-size="19" fill="#001f1f" letter-spacing="-0.4">5 of 5</text>

    <rect x="188" width="176" height="60" rx="12" fill="#fcf2fe"/>
    <text class="t" x="206" y="26" font-size="10.5" fill="#5c7070">Avg. response time</text>
    <text class="t m" x="206" y="48" font-size="19" fill="#001f1f" letter-spacing="-0.4">2h 10m</text>

    <rect x="376" width="176" height="60" rx="12" fill="#fff3c2"/>
    <text class="t" x="394" y="26" font-size="10.5" fill="#5c7070">Open blockers</text>
    <text class="t m" x="394" y="48" font-size="19" fill="#001f1f" letter-spacing="-0.4">0</text>
  </g>

  <!-- next up -->
  <rect x="32" y="324" width="576" height="48" rx="12" fill="#ffffff" stroke="#001f1f" stroke-opacity="0.1"/>
  <circle cx="58" cy="348" r="9" fill="#cdface" stroke="#001f1f" stroke-opacity="0.4"/>
  <text class="t m" x="80" y="352" font-size="12.5" fill="#001f1f">Next: API integration review</text>
  <text class="t" x="480" y="352" font-size="11.5" fill="#5c7070">Thu, 22 Aug</text>
</svg>
