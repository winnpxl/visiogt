    <rect x="470" y="146" width="122" height="6" rx="3" fill="#001f1f" fill-opacity="0.1"/>
    <rect x="470" y="146" width="111" height="6" rx="3" fill="url(#g1)"/>
  </g>

  <!-- candidate 3 -->
  <g transform="translate(0 176)">
    <rect x="24" y="102" width="592" height="70" rx="14" fill="#ffffff" stroke="#001f1f" stroke-opacity="0.09"/>
    <circle cx="66" cy="137" r="19" fill="#fff3c2"/>
    <text class="t m" x="66" y="142" font-size="12" fill="#001f1f" text-anchor="middle">SN</text>
    <text class="t m" x="98" y="132" font-size="13" fill="#001f1f">Sena N.</text>
    <text class="t" x="98" y="150" font-size="11.5" fill="#5c7070">Product Designer · Lagos</text>
