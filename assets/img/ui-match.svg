<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="AI talent matching panel with ranked verified candidates">
  <defs><style>.t{font-family:'Plus Jakarta Sans',system-ui,sans-serif}.m{font-weight:500}</style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#003d3d"/><stop offset="1" stop-color="#2a4e1c"/></linearGradient>
  </defs>
  <rect width="640" height="400" rx="12" fill="#ffffff"/>

  <text class="t m" x="32" y="44" font-size="16" fill="#001f1f" letter-spacing="-0.3">Matched talent</text>
  <rect x="188" y="28" width="126" height="22" rx="11" fill="#e1e1fa"/>
  <text class="t m" x="251" y="43" font-size="10" fill="#001f1f" text-anchor="middle">AI + HUMAN REVIEW</text>
  <text class="t" x="32" y="66" font-size="12" fill="#5c7070">Ranked against your brief · 214 profiles screened</text>
  <line x1="32" y1="86" x2="608" y2="86" stroke="#001f1f" stroke-opacity="0.08"/>

  <!-- candidate 1 -->
  <g transform="translate(0 0)">
    <rect x="24" y="102" width="592" height="82" rx="14" fill="#f8fbe7"/>
    <circle cx="66" cy="143" r="21" fill="#cdface"/>
    <text class="t m" x="66" y="148" font-size="13" fill="#001f1f" text-anchor="middle">KM</text>
    <text class="t m" x="100" y="134" font-size="13.5" fill="#001f1f">Kwame M.</text>
    <path d="M181 128 l3.4 2.3 4.1 -.4 1.3 3.9 3.3 2.5 -2 3.6 .5 4.1 -4 1.2 -2.8 3 -3.8-1.7 -3.8 1.7 -2.8-3 -4-1.2 .5-4.1 -2-3.6 3.3-2.5 1.3-3.9 4.1 .4z" fill="#003d3d"/>
    <path d="M175.5 133.8 l2.6 2.6 5.2-5.4" stroke="#cdface" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="t" x="100" y="152" font-size="11.5" fill="#5c7070">Senior Backend Engineer · Accra</text>
    <g>
      <rect x="100" y="160" width="66" height="18" rx="9" fill="#ffffff" stroke="#001f1f" stroke-opacity="0.14"/>
      <text class="t" x="133" y="173" font-size="10" fill="#5c7070" text-anchor="middle">Go · Kafka</text>
      <rect x="172" y="160" width="72" height="18" rx="9" fill="#ffffff" stroke="#001f1f" stroke-opacity="0.14"/>
      <text class="t" x="208" y="173" font-size="10" fill="#5c7070" text-anchor="middle">Payments</text>
    </g>
    <text class="t m" x="592" y="138" font-size="24" fill="#001f1f" text-anchor="end" letter-spacing="-0.6">96%</text>
    <text class="t" x="592" y="154" font-size="10" fill="#889494" text-anchor="end">BRIEF MATCH</text>
    <rect x="470" y="164" width="122" height="6" rx="3" fill="#001f1f" fill-opacity="0.1"/>
    <rect x="470" y="164" width="117" height="6" rx="3" fill="url(#g1)"/>
  </g>

  <!-- candidate 2 -->
  <g transform="translate(0 96)">
    <rect x="24" y="102" width="592" height="70" rx="14" fill="#ffffff" stroke="#001f1f" stroke-opacity="0.09"/>
    <circle cx="66" cy="137" r="19" fill="#e1e1fa"/>
    <text class="t m" x="66" y="142" font-size="12" fill="#001f1f" text-anchor="middle">LA</text>
    <text class="t m" x="98" y="132" font-size="13" fill="#001f1f">Lerato A.</text>
