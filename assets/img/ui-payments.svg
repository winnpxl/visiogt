<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Milestone payment schedule with funds held in escrow">
  <defs><style>.t{font-family:'DM Sans','Inter',system-ui,sans-serif}.m{font-weight:500}</style></defs>
  <rect width="640" height="400" rx="12" fill="#ffffff"/>

  <text class="t m" x="32" y="44" font-size="16" fill="#001f1f" letter-spacing="-0.3">Milestone payments</text>
  <rect x="228" y="28" width="104" height="22" rx="11" fill="#eff5ce"/>
  <text class="t m" x="280" y="43" font-size="10" fill="#001f1f" text-anchor="middle">FUNDS SECURED</text>
  <line x1="32" y1="66" x2="608" y2="66" stroke="#001f1f" stroke-opacity="0.08"/>

  <!-- summary -->
  <rect x="32" y="86" width="576" height="86" rx="14" fill="#f8fbe7"/>
  <text class="t" x="56" y="114" font-size="11" fill="#5c7070">Held in escrow</text>
  <text class="t m" x="56" y="148" font-size="30" fill="#001f1f" letter-spacing="-0.9">$18,400</text>
  <text class="t" x="380" y="114" font-size="11" fill="#5c7070">Released to date</text>
  <text class="t m" x="380" y="148" font-size="30" fill="#001f1f" letter-spacing="-0.9">$22,600</text>
  <line x1="356" y1="106" x2="356" y2="152" stroke="#001f1f" stroke-opacity="0.12"/>

  <!-- rows -->
  <g>
    <g transform="translate(0 0)">
      <text class="t m" x="32" y="208" font-size="12.5" fill="#001f1f">Discovery &amp; technical brief</text>
      <text class="t" x="400" y="208" font-size="12" fill="#5c7070">Released 21 Jun</text>
      <text class="t m" x="608" y="208" font-size="13" fill="#001f1f" text-anchor="end">$6,200</text>
      <line x1="32" y1="226" x2="608" y2="226" stroke="#001f1f" stroke-opacity="0.07"/>
    </g>
    <g transform="translate(0 46)">
      <text class="t m" x="32" y="208" font-size="12.5" fill="#001f1f">Design system &amp; UI flows</text>
      <text class="t" x="400" y="208" font-size="12" fill="#5c7070">Released 14 Jul</text>
      <text class="t m" x="608" y="208" font-size="13" fill="#001f1f" text-anchor="end">$16,400</text>
      <line x1="32" y1="226" x2="608" y2="226" stroke="#001f1f" stroke-opacity="0.07"/>
    </g>
    <g transform="translate(0 92)">
      <rect x="20" y="188" width="600" height="40" rx="12" fill="#e4f7f9"/>
      <text class="t m" x="32" y="212" font-size="12.5" fill="#001f1f">API integration &amp; data sync</text>
      <rect x="392" y="198" width="92" height="20" rx="10" fill="#fff3c2"/>
      <text class="t m" x="438" y="212" font-size="10" fill="#001f1f" text-anchor="middle">IN REVIEW</text>
      <text class="t m" x="608" y="212" font-size="13" fill="#001f1f" text-anchor="end">$11,000</text>
    </g>
    <g transform="translate(0 142)">
      <text class="t" x="32" y="208" font-size="12.5" fill="#5c7070">QA, load testing &amp; hardening</text>
      <text class="t" x="400" y="208" font-size="12" fill="#889494">Scheduled</text>
      <text class="t" x="608" y="208" font-size="13" fill="#5c7070" text-anchor="end">$7,400</text>
    </g>
  </g>
</svg>
